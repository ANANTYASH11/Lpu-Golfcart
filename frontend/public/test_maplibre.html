<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MapLibre 3D Test</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #020617; }
    #map { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          osm: {
            type: 'raster',
            tiles: [
              'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
            ],
            tileSize: 256
          }
        },
        layers: [
          {
            id: 'osm-tiles',
            type: 'raster',
            source: 'osm'
          }
        ]
      },
      center: [75.7050, 31.2550],
      zoom: 16.5,
      pitch: 48,
      bearing: -24
    });

    const custom3DLayer = {
      id: 'test-3d',
      type: 'custom',
      renderingMode: '3d',
      onAdd(mapInstance, gl) {
        this.camera = new THREE.Camera();
        this.scene = new THREE.Scene();
        this.renderer = new THREE.WebGLRenderer({
          canvas: mapInstance.getCanvas(),
          context: gl,
          antialias: true
        });
        this.renderer.autoClear = false;

        const light = new THREE.DirectionalLight(0xffffff, 2.0);
        light.position.set(0, -70, 100).normalize();
        this.scene.add(light);
        this.scene.add(new THREE.AmbientLight(0xffffff, 1.0));

        // Create vehicle test at LPU UniMall
        const mercBus = maplibregl.MercatorCoordinate.fromLngLat([75.7058, 31.2548], 0);
        const mercCart = maplibregl.MercatorCoordinate.fromLngLat([75.7063, 31.2545], 0);
        const mercRickshaw = maplibregl.MercatorCoordinate.fromLngLat([75.7053, 31.2552], 0);
        const meterScale = mercBus.meterInMercatorCoordinateUnits();
        const visualScale = meterScale * 4.0; // 4x scale factor for clear map legibility!

        // 1. Bus Model (Orange & White 7.5m Mini-Bus)
        const busGroup = new THREE.Group();
        const busBody = new THREE.Mesh(
          new THREE.BoxGeometry(2.4, 2.6, 7.5),
          new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.2 })
        );
        busBody.position.set(0, 1.4, 0);
        busGroup.add(busBody);
        const busRoofAC = new THREE.Mesh(
          new THREE.BoxGeometry(1.4, 0.4, 2.2),
          new THREE.MeshStandardMaterial({ color: 0xffffff })
        );
        busRoofAC.position.set(0, 2.9, -0.5);
        busGroup.add(busRoofAC);
        // Bus Ground Ring
        const busRing = new THREE.Mesh(
          new THREE.RingGeometry(2.8, 3.2, 32),
          new THREE.MeshBasicMaterial({ color: 0xf97316, side: THREE.DoubleSide })
        );
        busRing.position.set(0, 0.05, 0);
        busGroup.add(busRing);

        busGroup.position.set(mercBus.x, mercBus.y, mercBus.z);
        busGroup.scale.set(visualScale, visualScale, visualScale);
        busGroup.rotation.set(Math.PI / 2, 0, -THREE.MathUtils.degToRad(45));
        this.scene.add(busGroup);

        // 2. Golf Cart (White & Orange 3.2m Cart)
        const cartGroup = new THREE.Group();
        const cartBody = new THREE.Mesh(
          new THREE.BoxGeometry(1.2, 0.6, 3.0),
          new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 })
        );
        cartBody.position.set(0, 0.5, 0);
        cartGroup.add(cartBody);
        const cartRoof = new THREE.Mesh(
          new THREE.BoxGeometry(1.3, 0.08, 2.5),
          new THREE.MeshStandardMaterial({ color: 0xe2e8f0 })
        );
        cartRoof.position.set(0, 1.8, -0.2);
        cartGroup.add(cartRoof);
        const cartRing = new THREE.Mesh(
          new THREE.RingGeometry(1.6, 1.9, 32),
          new THREE.MeshBasicMaterial({ color: 0x3b82f6, side: THREE.DoubleSide })
        );
        cartRing.position.set(0, 0.05, 0);
        cartGroup.add(cartRing);

        cartGroup.position.set(mercCart.x, mercCart.y, mercCart.z);
        cartGroup.scale.set(visualScale, visualScale, visualScale);
        cartGroup.rotation.set(Math.PI / 2, 0, -THREE.MathUtils.degToRad(120));
        this.scene.add(cartGroup);

        // 3. E-Rickshaw (Green & Yellow 2.6m 3-Wheeler Auto)
        const rickshawGroup = new THREE.Group();
        const rickshawBody = new THREE.Mesh(
          new THREE.BoxGeometry(1.1, 0.8, 2.4),
          new THREE.MeshStandardMaterial({ color: 0x16a34a, roughness: 0.3 }) // Green body
        );
        rickshawBody.position.set(0, 0.6, -0.2);
        rickshawGroup.add(rickshawBody);
        const rickshawRoof = new THREE.Mesh(
          new THREE.BoxGeometry(1.15, 0.12, 2.0),
          new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.2 }) // Yellow roof
        );
        rickshawRoof.position.set(0, 1.7, -0.3);
        rickshawGroup.add(rickshawRoof);
        const rickshawRing = new THREE.Mesh(
          new THREE.RingGeometry(1.4, 1.7, 32),
          new THREE.MeshBasicMaterial({ color: 0x10b981, side: THREE.DoubleSide })
        );
        rickshawRing.position.set(0, 0.05, 0);
        rickshawGroup.add(rickshawRing);

        rickshawGroup.position.set(mercRickshaw.x, mercRickshaw.y, mercRickshaw.z);
        rickshawGroup.scale.set(visualScale, visualScale, visualScale);
        rickshawGroup.rotation.set(Math.PI / 2, 0, -THREE.MathUtils.degToRad(210));
        this.scene.add(rickshawGroup);

        console.log("All 3 vehicles added with visual scaling!");
      },
      render(gl, matrix) {
        this.camera.projectionMatrix = new THREE.Matrix4().fromArray(matrix);
        this.renderer.resetState();
        this.renderer.render(this.scene, this.camera);
        map.triggerRepaint();
      }
    };

    map.on('style.load', () => {
      console.log("Map style loaded, adding 3D layer");
      map.addLayer(custom3DLayer);
    });

    map.on('error', (e) => console.error("MapLibre error:", e));
  </script>
</body>
</html>
